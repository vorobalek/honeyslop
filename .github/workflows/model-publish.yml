name: Build and Push Model Image to Docker Hub
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'model/**'
      - '.github/workflows/model-publish.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: honeyslop-model
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: docker build -t "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_REPOSITORY }}:latest" model

      - name: Push image
        run: docker push "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_REPOSITORY }}:latest"
